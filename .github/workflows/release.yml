# Builds, signs and publishes a release when a version tag (e.g. v0.2.0) is
# pushed on main. The release is created as a draft: the installed apps only
# see it (via latest.json) once it has been published on GitHub.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gitflow: releases come from main only, never from develop or a
      # feature branch.
      - name: Check that the tag is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main - merge the release branch into main and tag there"
            exit 1
          fi

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f2)"; do
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json, tauri.conf.json and Cargo.toml"
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tiny Sales ${{ github.ref_name }}
          releaseBody: Installer for Windows - download the `*-setup.exe` below. Installed apps update themselves.
          releaseDraft: true
          prerelease: false
